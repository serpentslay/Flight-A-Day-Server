services:
  flight-a-day:
    build: .
    image: flight-a-day:local
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 120s
    environment:
      FLIGHT_DATA_DIR: /data
      FLIGHT_SOURCE: ${FLIGHT_SOURCE:-synthetic}
      FLIGHT_FIXTURE_DIR: /fixtures/generated
      FLIGHT_RUN_TIME: ${FLIGHT_RUN_TIME:-04:00}
      FLIGHT_START_DATE: ${FLIGHT_START_DATE:-}
      FLIGHT_PUBLISH_ENABLED: ${FLIGHT_PUBLISH_ENABLED:-false}
      FLIGHT_PUBLISH_BACKEND: ${FLIGHT_PUBLISH_BACKEND:-r2}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ACCESS_KEY_ID_FILE: ${R2_ACCESS_KEY_ID_FILE:-}
      R2_SECRET_ACCESS_KEY_FILE: ${R2_SECRET_ACCESS_KEY_FILE:-}
    volumes:
      - flight-data:/data
      - ./fixtures:/fixtures:ro
      - ./secrets:/run/secrets:ro
    tmpfs:
      - /tmp

volumes:
  flight-data:
